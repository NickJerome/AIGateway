[package]
name = "gateway"
version = "0.1.0"
edition = "2024"
[dependencies]
rquickjs = "=0.14.0"
toml = "=1.1.6"
anyhow = "=1.0.104"
sha2 = "=0.11.0"
hex = "=0.4.3"
libc = "=0.2.189"
url = "=2.5.8"
hmac = "=0.13.0"
futures = { version = "=0.3.34", default-features = false, features = ["executor"] }
serde = { version = "=1.0.229", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
async-channel = "=2.5.0"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "socks", "stream", "http2"] }
hyper = { version = "=1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
base64 = "=0.22.1"
argon2 = "=0.5.3"
[dev-dependencies]
tempfile = "=3.27.0"
libc = "=0.2.189"
rcgen = "=0.14.10"
tokio-rustls = "=0.26.5"
tokio = { version = "=1.53.1", features = ["io-util"] }
[profile.release]
opt-level = 3
debug = false

[build-dependencies]
sha2 = "=0.11.0"
hex = "=0.4.3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
