listen = "127.0.0.1:8080"
data_dir = "./data"
threads = 2
memory_limit_mb = 32
max_in_flight = 32
admin_token_env = "GATEWAY_ADMIN_TOKEN"
database_threads = 4
database_queue = 128
zip_upload_bytes = 33554432
zip_expanded_bytes = 134217728
zip_files = 1024
# plugins_dir = "./data/plugins"

[http]
request_body_bytes = 16777216
host_buffer_bytes = 33554432
queue_bytes = 262144
connect_timeout_ms = 10000
headers_timeout_ms = 120000
idle_timeout_ms = 300000
drain_timeout_ms = 30000

[telemetry]
queue_rows = 4096
buffer_bytes = 16777216
batch_rows = 64
flush_ms = 200
body = true
retain_rows = 100000
retain_days = 30
retain_bytes = 5368709120
usage_days = 90

[websocket]
max_message_bytes = 1048576
max_connections = 1024
close_timeout_ms = 5000
