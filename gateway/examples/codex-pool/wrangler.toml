name = "codex-pool"
main = "dist/index.mjs"
routes = ["/codex/*"]
compatibility_date = "2026-09-20"
[vars]
UPSTREAM = "https://chatgpt.com/backend-api/codex/responses"
AUTH_BASE = "https://auth.openai.com"
[[kv_namespaces]]
binding = "CONFIG"
id = "codex-pool-config"
[[durable_objects.bindings]]
name = "CREDS"
class_name = "Credential"
[[durable_objects.bindings]]
name = "POOL"
class_name = "Pool"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Credential", "Pool"]
[[unsafe.bindings]]
name = "IR"
type = "ir"
[[unsafe.bindings]]
name = "USAGE"
type = "usage"
[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "CALLS"
class_name = "Call"
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Call"]
